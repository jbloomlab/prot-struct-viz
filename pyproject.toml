[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prot-struct-viz"
version = "0.3.0"
description = "Render a protein structure as a self-contained static HTML Mol* view, colored and labeled per residue from a CSV."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Jesse Bloom", email = "jbloom@fredhutch.org" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "click>=8.0",
    "gemmi>=0.7",
    "jinja2>=3.0",
    "markdown-it-py>=3.0",
    "molviewspec>=1.8,<2",
    "pyyaml>=6",
]

[project.urls]
Documentation = "https://jbloomlab.github.io/prot-struct-viz/"
Homepage = "https://github.com/jbloomlab/prot-struct-viz"
Repository = "https://github.com/jbloomlab/prot-struct-viz"
Issues = "https://github.com/jbloomlab/prot-struct-viz/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16,<0.17",
    "black>=24",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[project.scripts]
prot-struct-viz = "prot_struct_viz.cli:main"

[tool.hatch.build.targets.sdist]
# The coding-standards submodule is another repository's content and is only
# relevant to developing here, so it does not belong in a published artifact.
exclude = ["/bloomlab-coding-standards"]

[tool.hatch.build.targets.wheel]
packages = ["src/prot_struct_viz"]
dev-mode-dirs = ["src"]

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's default rule set is not stable across releases, so state the rules we lint
# against; a ruff upgrade then changes them only when we say so.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
markers = ["network: test requires internet access to fetch from RCSB"]
