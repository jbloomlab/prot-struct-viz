# Influenza A/Victoria/2570/2019 (H1N1)pdm09 hemagglutinin, uncleaved (PDB
# 9GSP), as the deposited trimer.
#
# Render it with:  prot-struct-viz spec.yaml

structure: 9GSP
out: ../output/9gsp_antigenic_regions.html
# 9GSP deposits all three protomers, so the asymmetric unit is already the
# trimer and there is no symmetry for Mol* to expand.
assembly: au
on_mismatch: error-extra-in-csv
molstar_ui: hide

views:
  - name: Antigenic sites
    csv: coloring.csv
    title_md: title.md
    default_color: "#d9d9d9"
    default_representation: surface
    waters: hide
    ligands: show
    # Every sugar in the entry is named in coloring.csv, so `snfg` never applies
    # here; it is stated because no view of this spec has a default.
    glycans: snfg
    ions: show
