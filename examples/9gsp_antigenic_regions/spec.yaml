# Influenza A/Victoria/2570/2019 (H1N1)pdm09 hemagglutinin, uncleaved (PDB
# 9GSP), as the deposited trimer.
#
# Render it with:  prot-struct-viz spec.yaml

structure: 9GSP
out: ../output/9gsp_antigenic_regions.html
# 9GSP deposits all three protomers, so the asymmetric unit is already the
# trimer and there is no symmetry for Mol* to expand.
assembly: au
on_mismatch: error-extra-in-csv
molstar_ui: hide

definitions:
  base: &base
    default_color: "#d9d9d9"
    default_representation: spacefill
    waters: hide
    ligands: show
    ions: show

views:
  - <<: *base
    name: antigenic regions w glycans
    csv: antigenic-regions-w-glycans.csv
    title_md: antigenic-regions-w-glycans.md
    # Every sugar in the entry is named in this view's CSV, so `snfg` never
    # applies here; it is stated because no view of this spec has a default.
    glycans: snfg
    orientation:
      position: [-21.56, 242.34, 168.7]
      target: [126.87, 127.02, 121.9]
      up: [0.15, -0.2, 0.97]
      radius: 77.12
  - <<: *base
    name: antigenic regions
    csv: antigenic-regions.csv
    title_md: antigenic-regions.md
    glycans: hide
  - <<: *base
    name: California/2009 to D.3.1
    csv: california-2009-to-d-3-1.csv
    title_md: california-2009-to-d-3-1.md
    glycans: hide
  - <<: *base
    name: D.3.1 to D.3.1.1
    csv: d-3-1-to-d-3-1-1.csv
    title_md: d-3-1-to-d-3-1-1.md
    glycans: hide
  - <<: *base
    name: D.3.1.1 with G155E
    csv: d-3-1-1-with-g155e.csv
    title_md: d-3-1-1-with-g155e.md
    glycans: hide
