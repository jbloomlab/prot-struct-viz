# Influenza B/Beijing/1/87 neuraminidase with the DANA inhibitor bound (PDB
# 1F8B), as the biological tetramer.
#
# Render it with:  prot-struct-viz spec.yaml

structure: 1F8B
out: ../output/1f8b_active_site.html
assembly: "1"
on_mismatch: report
# The one example that opens with Mol*'s own panels showing, so the docs site
# shows both states.
molstar_ui: show

views:
  - name: Active site
    csv: coloring.csv
    chain_representation: chains.csv
    title_md: title.md
    default_color: "#d9d9d9"
    default_representation: cartoon
    waters: hide
    ligands: show
    glycans: snfg
    ions: show
