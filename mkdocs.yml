site_name: prot-struct-viz
site_description: Render a protein structure as a self-contained static HTML Mol* view.
site_url: https://jbloomlab.github.io/prot-struct-viz/
repo_url: https://github.com/jbloomlab/prot-struct-viz
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Overview: index.md
  - Examples: examples.md
  - CSV schema: csv-schema.md
  - Rendering options: rendering.md
  - CLI reference: cli.md
  - Python API: python-api.md
  - How it works: internals.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
  - mkdocs-click
  # Lets docs/examples.md include examples/*/command.sh and the input CSVs
  # verbatim, so the documented command is literally the one that ran.
  # base_path is the repo root, since the examples live outside docs/.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
