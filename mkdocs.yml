site_name: prot-struct-viz
site_description: Render a protein structure as a self-contained static HTML Mol* view.
site_url: https://jbloomlab.github.io/prot-struct-viz/
repo_url: https://github.com/jbloomlab/prot-struct-viz
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

nav:
  - Overview: index.md
  - Examples: examples.md
  - Spec reference: spec.md
  - CSV schema: csv-schema.md
  - The rendered page: viewer.md
  - Python API: python-api.md
  - How it works: internals.md

markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences

# Every key is described exactly once, so the pages lean on each other with deep
# links. MkDocs logs a broken anchor at `info` by default, which --strict ignores;
# at `warn` it fails the build. Anchors are resolved from the rendered HTML, so
# this covers the mkdocstrings headings on python-api.md too.
validation:
  links:
    anchors: warn

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
