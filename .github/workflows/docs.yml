name: docs

on:
  push:
    branches: [main]
  # Build (but do not deploy) on PRs. The docs build renders the examples,
  # which fetches from RCSB and runs the renderer end to end -- catching a
  # break on the PR rather than after it has already shipped to the site.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped to the ref now that PRs build too, so concurrent PRs do not queue
  # behind each other. Deploys to `main` still serialize, which is what the
  # Pages action requires.
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e ".[docs]"

      - name: Render examples
        # docs/examples/ is gitignored; docs/examples.md links to what this
        # writes, so --strict fails on a dead link if it is skipped.
        run: scripts/build_examples.sh docs/examples

      - name: Build
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only on push to main. A PR (especially from a fork) lacks `pages: write`,
    # and would publish PR-only content to the live site if it did not.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
