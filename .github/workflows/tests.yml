name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        # Network tests hit RCSB; run them only on the newest interpreter so a
        # transient RCSB outage fails one job rather than the whole matrix.
        # Both branches must be non-empty: `cond && '' || x` always yields x,
        # because the empty string is falsy and `||` falls through to it.
        run: pytest ${{ matrix.python-version == '3.14' && 'tests/' || 'tests/ -m "not network"' }}

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .
