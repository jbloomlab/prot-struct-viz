name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        # Network tests hit RCSB; run them only on the newer interpreter so a
        # transient RCSB outage fails one job rather than the whole matrix.
        run: pytest tests/ ${{ matrix.python-version == '3.13' && '' || '-m "not network"' }}

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check .
